<div class="job-card">
  <div class="job-header">
    <h3><a [routerLink]="['/jobs', job.id]">{{ job.title }}</a></h3>
    <span class="company">{{ job.company }}</span>
  </div>

  <div class="location">{{ job.location }}</div>

  <p class="description">{{ job.description }}</p>

  <div class="languages" *ngIf="job.requiredLanguages?.length">
    <span class="language-tag" *ngFor="let lang of job.requiredLanguages">{{ lang }}</span>
  </div>

  <div class="apply-section">
    <span *ngIf="alreadyApplied" class="applied-badge">✓ Applied</span>

    <ng-container *ngIf="!alreadyApplied">
      <app-button
        *ngIf="isLoggedIn"
        [label]="showApplyForm ? 'Cancel' : 'Apply Now'"
        type="button"
        (clicked)="toggleApplyForm()">
      </app-button>
      <span *ngIf="!isLoggedIn" class="login-hint">Log in to apply</span>
    </ng-container>

    <div class="apply-form" *ngIf="showApplyForm">
      <label>Cover Letter / Comment (optional)</label>
      <textarea
        [(ngModel)]="coverLetter"
        rows="4"
        placeholder="Tell us why you're a great fit for this role...">
      </textarea>
      <app-button label="Submit Application" type="button" (clicked)="onSubmitApplication()"></app-button>
    </div>
  </div>
</div>
