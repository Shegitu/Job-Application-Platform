<div class="form-container">
  <h2>Log In</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-input
      label="Email"
      formControlName="email"
      type="email"
      [errorMessage]="form.get('email')?.touched && form.get('email')?.invalid ? 'Please enter a valid email address.' : ''">
    </app-form-input>

    <app-form-input
      label="Password"
      formControlName="password"
      type="password"
      [errorMessage]="form.get('password')?.touched && form.get('password')?.invalid ? 'Password is required.' : ''">
    </app-form-input>

    <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

    <app-button label="Log In" type="submit" [disabled]="isSubmitting"></app-button>

    <p class="switch-link">Don't have an account? <a routerLink="/signup">Sign up</a></p>
  </form>
</div>
