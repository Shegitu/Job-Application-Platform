<div class="form-container">
  <app-step-header [currentStep]="3" [totalSteps]="4"></app-step-header>

  <h2>Upload Resume</h2>

  <app-resume-upload
    [selectedFile]="selectedFile"
    [status]="status"
    (fileSelected)="onFileSelected($event)"
    (uploadClicked)="onUpload()">
  </app-resume-upload>

  <app-language-selector
    *ngIf="status === 'completed'"
    [extractedLanguages]="extractedLanguages"
    (selectionChanged)="onLanguagesChanged($event)">
  </app-language-selector>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div *ngIf="isSaving" class="hint">Saving profile...</div>

  <div class="button-row">
    <app-button label="Back" type="button" (clicked)="onBack()"></app-button>
    <app-button
      label="Save Profile"
      type="button"
      [disabled]="status !== 'completed' || isSaving"
      (clicked)="onSaveProfile()">
    </app-button>
  </div>
</div>
