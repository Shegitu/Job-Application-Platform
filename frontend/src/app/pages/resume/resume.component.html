<div class="form-container">
  <app-step-header [currentStep]="3" [totalSteps]="4"></app-step-header>

  <h2>Upload Resume</h2>

  <app-resume-upload
    [selectedFile]="selectedFile"
    [status]="status"
    (fileSelected)="onFileSelected($event)"
    (uploadClicked)="onUpload()">
  </app-resume-upload>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div *ngIf="status === 'completed'" class="languages-preview">
    <p>Detected languages:</p>
    <ul>
      <li *ngFor="let lang of extractedLanguages">{{ lang }}</li>
    </ul>
  </div>

  <div class="button-row">
    <app-button label="Back" type="button" (click)="onBack()"></app-button>
    <app-button label="Next" type="button" [disabled]="status !== 'completed'" (click)="onNext()"></app-button>
  </div>
</div>
