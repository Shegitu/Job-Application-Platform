<div class="form-container">
  <app-step-header [currentStep]="3" [totalSteps]="4"></app-step-header>

  <h2>Upload Resume</h2>

  <app-resume-upload
    [selectedFile]="selectedFile"
    [status]="status"
    (fileSelected)="onFileSelected($event)"
    (uploadClicked)="onUpload()">
  </app-resume-upload>

  <app-language-selector
    *ngIf="status === 'completed'"
    [extractedLanguages]="extractedLanguages"
    (selectionChanged)="onLanguagesChanged($event)">
  </app-language-selector>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div *ngIf="isSubmitting" class="hint">Submitting...</div>

  <div class="button-row">
    <app-button label="Back" type="button" (click)="onBack()"></app-button>
    <app-button
      label="Submit Application"
      type="button"
      [disabled]="status !== 'completed' || isSubmitting"
      (click)="onSubmit()">
    </app-button>
  </div>
</div>
